<ng-container *ngIf="facade.gameData$ | async as gameData">
  <div
    class="game-loading"
    *ngIf="gameData.scene === 'game' && !gameData.mapLoaded"
  >
    <div class="loading-text">Loading map…</div>
    <div class="loading-bar"><div class="loading-fill"></div></div>
  </div>
  <app-title-screen
    (changeScene)="changeScene($event)"
    *ngIf="gameData.scene === 'title'"
  >
  </app-title-screen>
  <app-game-select
    *ngIf="gameData.scene === 'game-select'"
    (changeScene)="changeScene($event)"
    (setPlayerName)="addPlayer($event)"
  ></app-game-select>
  <app-play-lobby
    *ngIf="gameData.scene === 'play-lobby'"
    [gameData]="gameData"
    (changeScene)="changeScene($event)"
  ></app-play-lobby>
  <app-game
    *ngIf="gameData.scene === 'game'"
    #gameComp
    [gameData]="gameData"
    (keyChange)="keyChange($event, gameData.me, gameData.lobbyPlayers)"
    (changeTool)="changeTool($event)"
    (changeHoveredFarm)="changeHoveredFarm($event)"
    (reduceSeedCount)="reduceSeedCount($event)"
    (changeEnergy)="changeEnergy($event)"
    (changeVelocity)="changeVelocity($event)"
    (changeWaterMeter)="changeWaterMeter($event)"
    (changeMoney)="changeMoney($event)"
    (canHarvest)="changeCanHarvest($event)"
    (canOpenShop)="changeCanOpenShop($event)"
    (openShop)="openShop($event)"
    (canFillWater)="changeCanFillWater($event)"
    (canEnterHouse)="changeCanEnterHouse($event)"
    (isSleeping)="changeIsSleeping($event)"
    (changePlayerState)="changePlayerState($event)"
    (cultivateOther)="cultivateOthers($event)"
    (updatePlayer)="updatePlayer($event)"
    (playerFromMiddle)="playerFromMiddle($event)"
    (dropPickupable)="dropPickupable($event)"
    (removePickupable)="removePickupable($event)"
    (playerCultivate)="playerCultivate($event)"
    (playerIsWatering)="playerIsWatering($event)"
    (goInHouse)="goInHouse($event)"
  ></app-game>
  <app-shade
    *ngIf="gameData.scene === 'game'"
    [gameData]="gameData"
  ></app-shade>
  <app-game-ui
    *ngIf="gameData.scene === 'game'"
    [gameData]="gameData"
    (changeTool)="changeTool($event)"
    (toggleSeedMode)="toggleSeedMode()"
  ></app-game-ui>
  <app-upgrade
    *ngIf="gameData.openUpgrades"
    [gameData]="gameData"
    [upgrades]="facade.upgradeChoices$ | async"
    (upgrade)="getUpgrade($event)"
    (openUpgrades)="upgradePopUp($event)"
  ></app-upgrade>
  <app-merchant
    [gameData]="gameData"
    [merchantItems]="facade.merchantItems$ | async"
    (purchase)="purchaseItem($event)"
    (openShop)="openShop($event)"
    (changeTool)="changeTool($event)"
    (showUpgrades)="upgradePopUp($event)"
    *ngIf="gameData.openShop"
  ></app-merchant>
  <app-win-screen
    *ngIf="gameData.showWinScreen"
    [gameData]="gameData"
  ></app-win-screen>
  <app-controls-card
    *ngIf="showControlsCard"
    (dismissed)="showControlsCard = false"
  ></app-controls-card>
</ng-container>
